{% extends 'base.html' %}

{% block title %}删除课程{% endblock %}

{% block content %}
<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
        <h2 class="confirm-title">删除课程</h2>
        <p class="confirm-text">删除课程后，相关联数据也可能受影响。</p>
        <div class="confirm-target">{{ course.name }}</div>

        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <button type="submit" class="btn" style="background:#dc2626;">确认删除</button>
            <a class="btn btn-plain" href="{% url 'accreditation:course_detail' course.id %}">取消</a>
        </form>
    </div>
</div>
{% endblock %}
