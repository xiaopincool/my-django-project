{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="form-page-wrap">
    <div class="form-card">
        <div class="form-head">
            <div>
                <h2 class="page-title mb-2">{{ page_title }}</h2>
                <p class="page-subtitle mb-0">填写课程基础信息</p>
            </div>
            <a class="btn" href="{% url 'accreditation:course_list' %}">返回列表</a>
        </div>

        <form method="post" class="app-form">
            {% csrf_token %}

            <div class="form-grid two-col">
                <div class="form-item">
                    <label>课程编号</label>
                    {{ form.code }}
                </div>

                <div class="form-item">
                    <label>课程名称</label>
                    {{ form.name }}
                </div>

                <div class="form-item">
                    <label>学分</label>
                    {{ form.credit }}
                </div>

                <div class="form-item">
                    <label>课程类型</label>
                    {{ form.course_type }}
                </div>

                <div class="form-item">
                    <label>开课学期</label>
                    {{ form.term }}
                </div>

                <div class="form-item">
                    <label>负责人</label>
                    {{ form.teacher }}
                </div>

                <div class="form-item check-item">
                    <label>状态</label>
                    <div class="checkbox-wrap">{{ form.is_active }} <span>启用</span></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">保存</button>
                <a class="btn btn-plain" href="{% url 'accreditation:course_list' %}">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
