{% extends 'base.html' %}

{% block title %}删除整改项{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card" style="max-width: 760px;">
        <div class="card-body">
            <h2 class="page-title mb-3">删除整改项</h2>
            <p class="mb-2">你确定要删除这条整改项吗？</p>
            <p class="text-danger mb-4">删除后不可恢复，请确认后再操作。</p>

            <div class="mb-4">
                <div class="small text-muted">问题标题</div>
                <div>{{ item.title }}</div>
            </div>

            <div class="mb-4">
                <div class="small text-muted">问题来源</div>
                <div>{{ item.get_source_display }}</div>
            </div>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">确认删除</button>
                <a href="{% url 'accreditation:improvement_detail' item.id %}" class="btn btn-outline-secondary">返回详情</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
