{% extends 'base.html' %}

{% block title %}删除指标点{% endblock %}

{% block content %}
    <div class="card">
        <h2 class="page-title">删除指标点</h2>

        <p>你确定要删除这个指标点吗？</p>
        <p><strong>{{ indicator.code }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn" style="background: #dc2626;">确认删除</button>
            <a class="btn" href="{% url 'accreditation:requirement_detail' requirement.id %}" style="margin-left: 10px;">取消</a>
        </form>
    </div>
{% endblock %}
