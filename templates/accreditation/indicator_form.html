{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="form-page-wrap">
    <div class="form-card">
        <div class="form-head">
            <div>
                <h2 class="page-title mb-2">{{ page_title }}</h2>
                <p class="page-subtitle mb-0">当前所属毕业要求：{{ requirement.name }}</p>
            </div>
            <a class="btn" href="{% url 'accreditation:requirement_detail' requirement.id %}">返回详情</a>
        </div>

        <form method="post" class="app-form">
            {% csrf_token %}

            <div class="form-grid two-col">
                <div class="form-item">
                    <label>指标点编号</label>
                    {{ form.code }}
                </div>

                <div class="form-item">
                    <label>排序值</label>
                    {{ form.sort }}
                </div>
            </div>

            <div class="form-item">
                <label>指标点内容</label>
                {{ form.content }}
            </div>

            <div class="form-item check-item">
                <label>状态</label>
                <div class="checkbox-wrap">{{ form.is_active }} <span>启用</span></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">保存</button>
                <a class="btn btn-plain" href="{% url 'accreditation:requirement_detail' requirement.id %}">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
