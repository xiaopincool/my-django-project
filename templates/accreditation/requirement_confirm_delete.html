{% extends 'base.html' %}

{% block title %}删除毕业要求{% endblock %}

{% block content %}
<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
        <h2 class="confirm-title">删除毕业要求</h2>
        <p class="confirm-text">这条数据删除后将无法恢复，你确定还要继续吗？</p>
        <div class="confirm-target">{{ requirement.code }} {{ requirement.name }}</div>

        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <button type="submit" class="btn" style="background:#dc2626;">确认删除</button>
            <a class="btn btn-plain" href="{% url 'accreditation:requirement_detail' requirement.id %}">取消</a>
        </form>
    </div>
</div>
{% endblock %}
