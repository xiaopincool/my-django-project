{% extends 'base.html' %}

{% block title %}删除学生{% endblock %}

{% block content %}
<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
        <h2 class="confirm-title">删除学生</h2>
        <p class="confirm-text">删除后该学生基础信息将不再保留。</p>
        <div class="confirm-target">{{ student.name }} / {{ student.student_no }}</div>

        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <button type="submit" class="btn" style="background:#dc2626;">确认删除</button>
            <a class="btn btn-plain" href="{% url 'accreditation:student_list' %}">取消</a>
        </form>
    </div>
</div>
{% endblock %}
