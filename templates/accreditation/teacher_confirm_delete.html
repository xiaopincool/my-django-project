{% extends 'base.html' %}

{% block title %}删除教师{% endblock %}

{% block content %}
<div class="confirm-shell">
    <div class="confirm-card">
        <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
        <h2 class="confirm-title">删除教师</h2>
        <p class="confirm-text">删除后，该教师账号会从前台管理页移除。</p>
        <div class="confirm-target">{{ teacher_obj.realname|default:teacher_obj.username }} / {{ teacher_obj.username }}</div>

        <form method="post" class="confirm-actions">
            {% csrf_token %}
            <button type="submit" class="btn" style="background:#dc2626;">确认删除</button>
            <a class="btn btn-plain" href="{% url 'accreditation:teacher_list' %}">取消</a>
        </form>
    </div>
</div>
{% endblock %}
